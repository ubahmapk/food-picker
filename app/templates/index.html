<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Picker</title>
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="container">
        <h1><a href="#" onclick="showHome(); return false;" style="text-decoration:none;color:inherit;">🍽️ Food Picker</a></h1>
        <ul>
            <li><a href="#" onclick="showHome(); return false;">Pick</a></li>
            <li><a href="#" onclick="showManage(); return false;">Manage</a></li>
            <li><a href="#" onclick="showAbout(); return false;">About</a></li>
            <li><button id="theme-toggle" class="theme-btn outline" onclick="cycleTheme()">🌓</button></li>
        </ul>
    </nav>

    <main class="container">
        <div id="home" class="view">
            <h2>Select Categories</h2>
            <div id="categories-list"></div>
            <button id="pick-btn" onclick="makePick()">Pick for Me</button>
            <div id="result" style="margin-top: 2rem;"></div>
            <div id="veto-list" style="margin-top: 1rem;"></div>
        </div>

        <div id="manage" class="view" style="display: none;">
            <h2>Manage</h2>
            <div role="group" id="manage-tabs">
                <button id="tab-places"      class="tab-btn"         onclick="showManageTab('places')">Places</button>
                <button id="tab-categories"  class="tab-btn outline" onclick="showManageTab('categories')">Categories</button>
                <button id="tab-importexport" class="tab-btn outline" onclick="showManageTab('importexport')">Import / Export</button>
            </div>

            <div id="manage-places" class="manage-panel">
                <h3>Add Place</h3>
                <div style="margin-bottom: 1.5rem;">
                    <input type="text" id="new-place-input" placeholder="Place name">
                    <label>Categories:</label>
                    <div id="place-categories-list"></div>
                    <button onclick="addPlace()">Add Place</button>
                </div>
                <h3>Places</h3>
                <div id="places-list"></div>
            </div>

            <div id="manage-categories" class="manage-panel" style="display: none;">
                <h3>Add Category</h3>
                <div style="margin-bottom: 1.5rem;">
                    <input type="text" id="new-category-input" placeholder="New category name">
                    <button onclick="addCategory()">Add</button>
                </div>
                <h3>Categories</h3>
                <div id="categories-manage-list"></div>
            </div>

            <div id="manage-importexport" class="manage-panel" style="display: none;">
                <h3>Import / Export</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;">
                    <button onclick="exportData('toml')">Export as TOML</button>
                    <button onclick="exportData('json')">Export as JSON</button>
                </div>
                <label>Import file</label>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;">
                    <input type="file" id="import-file" accept=".toml,.json" style="flex: 1;">
                    <button onclick="importData()">Import</button>
                </div>
            </div>
        </div>

        <div id="about" class="view" style="display: none;">
            <h2>About</h2>
            <div id="about-content"></div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
