services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./places.toml:/app/places.toml
    environment:
      - PLACES_FILE=/app/places.toml
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
